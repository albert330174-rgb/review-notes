body{margin:0;background:var(--bg);color:var(--label);}
.in{max-width:640px;margin:0 auto;padding:40px 20px 72px;font-size:17px;line-height:1.55;word-break:keep-all;}

.fs-row .fs-sum{cursor:default;}

.fs-w{flex:1;min-width:0;}
.fs-t{display:block;font-variant-numeric:tabular-nums;}
.fs-s{display:block;font-size:13px;line-height:18px;color:var(--sec);margin-top:2px;}
.fs-cv{flex:0 0 8px;width:8px;height:14px;color:var(--ter);transition:transform .2s;}
.fs-row[open] .fs-cv{transform:rotate(90deg);}
.fs-g{margin:0;padding:0 20px 14px;font-size:15px;line-height:1.5;color:var(--sec);}

.fs-go:active{background:var(--fill);}
.fs-chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;line-height:18px;font-weight:600;}
.fs-chip.fs-fixed{color:var(--ok);background:var(--ok-bg);}
.fs-chip.fs-review{color:var(--wait);background:var(--wait-bg);}
.fs-chip.fs-held{color:var(--sec);background:var(--fill);}
.fs-chip.fs-thx{background:var(--fill);}
.fs-chip.fs-new,.fs-chip.fs-ans{color:var(--acc);background:var(--new-bg);}
.fs-g.fs-ans{color:var(--label);}
.fs-x .fs-g+.fs-ans{margin-top:10px;}

.fs-ans span{display:block;}
.fs-list .fs-only-mine{display:none;}
.fs-seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px;}
.fs-seg button{flex:1;border:0;background:transparent;color:var(--label);font:inherit;font-size:15px;height:32px;border-radius:7px;cursor:pointer;}
.fs-seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600;}
.fs-seg button span{color:var(--sec);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums;}
.fs-h{font-size:13px;line-height:18px;color:var(--sec);font-weight:400;margin:0 20px 6px;}

.fs-del{flex:0 0 auto;width:28px;height:28px;margin-right:-4px;border:0;border-radius:14px;background:transparent;color:var(--ter);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.fs-del svg{width:12px;height:12px;}
@media (hover:hover){.fs-del:hover{background:var(--fill);}}
.fs-seg[hidden],.fs-more[hidden]{display:none;}
.fs-more{display:block;width:100%;border:0;background:none;color:var(--acc);font:inherit;font-size:15px;padding:14px 0 4px;cursor:pointer;}
.fs-empty{padding:20px;color:var(--sec);text-align:center;}
.fs-cap{font-size:13px;line-height:18px;color:var(--sec);margin:8px 20px 0;}
:root{--new-bg:rgba(0,122,255,.12);--ok:#248A3D;--ok-bg:rgba(52,199,89,.14);--wait:#B25000;--wait-bg:rgba(255,149,0,.16);}

.fs-mine .fs-h{display:flex;justify-content:space-between;align-items:baseline;}

<script>

(function(){
  var L=document.querySelector('.fs-list'); if(!L) return;
  var e0=function(x){ return String(x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var CVI='<svg class="fs-cv" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>',
      GOI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>';
  function rowHTML(x){
    var head='<div class="fs-w"><span class="fs-t">'+e0(x.d)+'</span><span class="fs-s">'+e0(x.s)+(x.dn?e0(x.dn):'')+'</span></div><span class="fs-chip fs-'+e0(x.c)+'">'+e0(x.l)+'</span>';
    if(!x.g && !x.a) return '<div class="fs-row" data-k="'+e0(x.k)+'"><div class="fs-sum">'+head+'<span class="fs-cv"></span></div></div>';
    return '<details class="fs-row'+(x.m?' fs-only-mine':'')+'" data-k="'+e0(x.k)+'"'+(x.a?' data-a="'+e0(x.a)+'"':'')+'><summary>'+head+CVI+'</summary><div class="fs-x"><div>'
      +(x.g?'<p class="fs-g">'+e0(x.g)+'</p>':'')+(x.w?'<p class="fs-g fs-why">보류 사유 · '+e0(x.w)+'</p>':'')+(x.h?'<p class="fs-g fs-why">'+e0(x.h)+'</p>':'')+'</div>'
      +(x.go?'<a class="fs-go" href="'+e0(x.go)+'" aria-label="'+e0(x.gl)+'" title="'+e0(x.gl)+'">'+GOI+'</a>':'')+'</div></details>'; }
  fetch('fb-recent.json',{cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(D){
    L.innerHTML=(D.rows||[]).map(rowHTML).join('')+'<div class="fs-gone" hidden data-thx="'+e0((D.thx||[]).join(';'))+'" data-ks="'+e0((D.ks||[]).join(';'))+'"></div>';
    var at=document.querySelector('.fs-at'); if(at) at.textContent=D.at||'';
    start(D);
  }).catch(function(){ L.innerHTML='<div class="fs-empty">불러오지 못함</div>'; });
  function start(D){
  var arc=false;
  var W=180000, PEND_KEEP=7*864e5, MINE_KEEP=60*864e5, PAGE=20, now=Date.now(), tab='', shown=PAGE;
  var seg=document.querySelector('.fs-seg'), more=document.querySelector('.fs-more'), mineBox=document.querySelector('.fs-mine');
  var key=function(r){ var k=r.dataset.k.split('|'); return {s:k[0],t:new Date(k[1]).getTime()}; };
  var have=[].map.call(L.querySelectorAll('.fs-row[data-k]'),key);
  var only=[].slice.call(L.querySelectorAll('.fs-only-mine')); only.forEach(function(r){ r.remove(); });   
  function ans(c){ var a=c.getAttribute('data-a'); if(!a) return; c.open=true; var t=''; try{ t=decodeURIComponent(escape(atob(a))); }catch(e){ return; }   
    var p=document.createElement('p'); p.className='fs-g fs-ans'; p.innerHTML='<b>답장</b>'+t.split('\n').filter(function(x){ return x.trim(); }).map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('');
    var box=c.querySelector('.fs-x>div'); if(box) box.appendChild(p); }
  var thx=[]; var gone=document.querySelector('.fs-gone'); if(gone) (gone.dataset.thx||'').split(';').filter(Boolean).forEach(function(x){ var k=x.split('|'); thx.push({s:k[0],t:new Date(k[1]).getTime()}); });   
  if(gone) (gone.dataset.ks||'').split(';').filter(Boolean).forEach(function(x){ var k=x.split('|'); have.push({s:k[0],t:new Date(k[1]).getTime()}); });   
  try{ var myId=localStorage.getItem('rn-fb-id'), fi=document.querySelector('.fs-id'); if(myId&&fi){ fi.textContent='#'+myId; fi.hidden=false; } }catch(e){}   
  var sent=[]; try{ sent=JSON.parse(localStorage.getItem('rn-fb-sent')||'[]').filter(function(x){ return x&&x.s&&now-x.t<MINE_KEEP; }); }catch(e){}
  function same(a,b){ return a.s===b.s && Math.abs(a.t-b.t)<=W; }
  var XI='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>';
  var esc=function(x){ return String(x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  function isOpen(r){ return r.classList.contains('fs-pend') || !!r.querySelector('.fs-review'); }
  function render(){
    var rows=[].slice.call(L.querySelectorAll('.fs-row')), open=rows.filter(isOpen), done=rows.filter(function(r){ return !isOpen(r); });
    if(!tab) tab=open.length?'open':'done';
    seg.hidden=false; seg.querySelector('[data-v="open"] span').textContent=open.length; seg.querySelector('[data-v="done"] span').textContent=done.length;
    [].forEach.call(seg.querySelectorAll('button'),function(b){ b.classList.toggle('on', b.dataset.v===tab); });
    var list=tab==='open'?open:done;
    rows.forEach(function(r){ r.classList.add('hid'); });
    list.forEach(function(r,i){ if(tab==='open' || i<shown) r.classList.remove('hid'); });

    var e=L.querySelector('.fs-empty'); if(!e){ e=document.createElement('div'); e.className='fs-empty'; L.appendChild(e); } if(e){ e.style.display=list.length?'none':''; e.textContent=tab==='open'?'진행 중인 제보 없음':'받은 제보 없음'; }
    var g=mineBox.querySelector('.fs-grp'); g.innerHTML='';
    rows.concat(only).forEach(function(r){ var k=r.dataset.k?key(r):r._k; var m=k && sent.filter(function(x){ return same(x,k); })[0]; if(m){ var c=r.cloneNode(true); c.classList.remove('hid'); ans(c);   
      var x=document.createElement('button'); x.type='button'; x.className='fs-del'; x.setAttribute('aria-label','이 기기 목록에서 지우기'); x.title='지우기'; x.innerHTML=XI;   
      x.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); sent=sent.filter(function(y){ return y!==m; }); try{ localStorage.setItem('rn-fb-sent', JSON.stringify(sent)); }catch(e){} if(window.RNSync) RNSync.fbGone(m.t); render(); });
      (c.querySelector('summary')||c.querySelector('.fs-sum')).insertBefore(x, (c.querySelector('summary')||c.querySelector('.fs-sum')).firstChild); g.appendChild(c); } });
    thx.forEach(function(k){ var m=sent.filter(function(x){ return same(x,k); })[0]; if(!m) return; var d=new Date(k.t), h=d.getHours();
      var r=document.createElement('div'); r.className='fs-row'; r.innerHTML='<div class="fs-sum"><div class="fs-w"><span class="fs-t">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+(h<12?'오전':'오후')+' '+(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+'</span><span class="fs-s">'+esc(k.s)+'</span></div><span class="fs-chip fs-thx" title="이용해 주셔서 감사합니다" aria-label="감사">💙</span><span class="fs-cv"></span></div>';
      g.appendChild(r); });
    mineBox.hidden=!g.children.length;
  }
  seg.addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return; tab=b.dataset.v; shown=PAGE; render(); });
  more.addEventListener('click',function(){ shown+=PAGE;
    var nd=[].filter.call(L.querySelectorAll('.fs-row'),function(r){ return !isOpen(r); }).length;
    if(arc || !(D.old>0) || nd>shown){ render(); return; }
    arc=true; more.disabled=true;   
    fetch('fb-archive.json',{cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(A){ var h=(A.rows||[]).filter(function(x){ return !x.m; }).map(rowHTML).join(''), em=L.querySelector('.fs-empty');
      if(em) em.insertAdjacentHTML('beforebegin',h); else L.insertAdjacentHTML('beforeend',h); }).catch(function(){ arc=false; }).then(function(){ more.disabled=false; render(); }); });
  var lastPend=[];
  function draw(pend){ lastPend=pend;
    var all=pend.slice(); sent.forEach(function(m){ if(now-m.t<PEND_KEEP && !all.some(function(p){ return same(p,m); })) all.push(m); });
    all=all.filter(function(p){ return !have.some(function(h){ return same(h,p); }); }).sort(function(a,b){ return b.t-a.t; });
    [].forEach.call(L.querySelectorAll('.fs-pend'),function(r){ r.remove(); });
    L.insertAdjacentHTML('afterbegin',all.map(function(p){ var d=new Date(p.t), h=d.getHours();

        +'</span><span class="fs-s">'+esc(p.s)+'</span></div><span class="fs-chip fs-new">접수됨</span><span class="fs-cv"></span></div></div>'; }).join(''));
    [].forEach.call(L.querySelectorAll('.fs-pend'),function(r,i){ r._k=all[i]; });

  (function(f){ if(document.readyState==='complete') f(); else addEventListener('load', f); })(function(){ if(!window.RNSync) return; function mt(){ var t=mineBox.querySelector('.fs-mt'); if(t) t.textContent=RNSync.on()?'내가 보낸 제보':'이 기기에서 보낸 제보'; } mt();
    function upd(){ try{ sent=JSON.parse(localStorage.getItem('rn-fb-sent')||'[]').filter(function(x){ return x&&x.s&&now-x.t<MINE_KEEP; }); var fi=document.querySelector('.fs-id'), id=localStorage.getItem('rn-fb-id'); if(fi&&id){ fi.textContent='#'+id; fi.hidden=false; } }catch(e){} mt(); draw(lastPend); } RNSync.onChange(upd); upd(); });
  var U='https://docs.google.com/spreadsheets/d/e/2PACX-1vTgYCftZOObbxcZS6GW8t19CDikJvKT9IRlrCDyX3yTvwHOultBYoE9sZ9HmKJ-qF9Sw5QaHpL8ZWx4/pub?gid=21&single=true&output=csv'; if(!U) return;

  }).catch(function(){});
  }

</script>
