body{margin:0;background:var(--bg);color:var(--label);}
.in{max-width:640px;margin:0 auto;padding:40px 20px 72px;font-size:17px;line-height:1.55;word-break:keep-all;}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc);text-decoration:none;font-size:17px;margin:0 0 8px -4px;}
.back svg{width:10px;height:17px;}
.in h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em;margin:0 0 8px;}
.fs-lead{color:var(--sec);margin:0 0 20px;}
.fs-grp{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
.fs-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px 10px 20px;box-sizing:border-box;position:relative;}
.fs-row+.fs-row::before{content:'';position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep);}
.fs-row .fs-w{flex:1;min-width:0;}
.fs-row .fs-t{display:block;font-variant-numeric:tabular-nums;}
.fs-row .fs-s{display:block;font-size:13px;line-height:18px;color:var(--sec);}
.fs-row .fs-r{flex:0 0 auto;text-align:right;}
.fs-chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;line-height:18px;font-weight:600;}
.fs-chip.fs-fixed{color:var(--ok);background:var(--ok-bg);}
.fs-chip.fs-review{color:var(--wait);background:var(--wait-bg);}
.fs-chip.fs-held{color:var(--sec);background:var(--fill);}
.fs-row .fs-d{display:block;font-size:13px;line-height:18px;color:var(--sec);margin-top:3px;}
.fs-empty{padding:20px;color:var(--sec);text-align:center;}
.fs-cap{font-size:13px;line-height:18px;color:var(--sec);margin:8px 20px 0;}
.fs-key{margin:28px 0 0;padding:0;list-style:none;font-size:15px;line-height:1.5;color:var(--sec);}
.fs-key li{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;}
.fs-key .fs-chip{flex:0 0 auto;}
.fs-go{display:inline-block;margin-top:24px;color:var(--acc);text-decoration:none;}
:root{--ok:#248A3D;--ok-bg:rgba(52,199,89,.14);--wait:#B25000;--wait-bg:rgba(255,149,0,.16);}
:root[data-theme="dark"]{--ok:#30D158;--ok-bg:rgba(48,209,88,.18);--wait:#FF9F0A;--wait-bg:rgba(255,159,10,.18);}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--ok:#30D158;--ok-bg:rgba(48,209,88,.18);--wait:#FF9F0A;--wait-bg:rgba(255,159,10,.18);}}
@media (max-width:430px){ .in{padding:28px 16px 56px;} .in h1{font-size:28px;line-height:34px;} }
</style>
