  var KH=Math.min(90, Math.round(H*.5)), KT=8, KB=KT+KH, KHt=KB+20, km=Math.max(1, Math.max.apply(null, S.map(function(r){ return ksum(r)||0; }))), kmx=Math.ceil(km/10)*10;
  var step=n<2?60:(W-L-RR)/(n-1), bw=Math.min(W>500?16:10, step*.42), g='';
  [0,kmx/2,kmx].forEach(function(v){ var y=KB-v/kmx*KH; g+='<line x1="'+L+'" x2="'+(W-RR+12)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="mk-grid"/><text x="'+(W-RR+16)+'" y="'+(y+3).toFixed(1)+'" class="mk-ax">'+v+'</text>'; });
  S.forEach(function(r,i){ if(!r.k) return; var y=KB, x=X(i,n)-bw/2, si=0;
    g+='<g class="mk-bar'+(cur!==n-1&&i!==cur?' dim':'')+'">';
    r.k.forEach(function(v,j){ if(!v) return; var hh=v/kmx*KH; y-=hh; g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(.8, hh-(si?1.5:0)).toFixed(1)+'" fill="'+KC[j]+'"/>'; si++; });
    g+='</g>'; });
  var every=Math.max(1,Math.ceil(n/(W>500?15:7)));
  S.forEach(function(r,i){ if(i%every===0||i===n-1) g+='<text x="'+X(i,n).toFixed(1)+'" y="'+(KHt-5)+'" text-anchor="middle" class="mk-ax">'+md(r.d)+'</text>'; });
  if(cur!==n-1) g+='<line class="mk-x" x1="'+X(cur,n).toFixed(1)+'" x2="'+X(cur,n).toFixed(1)+'" y1="'+KT+'" y2="'+KB+'"/>';
  $('kwrap').innerHTML='<svg class="mk-svg" viewBox="0 0 '+W+' '+KHt+'" role="img" aria-label="회차별 오답 갈래">'+g+'</svg>';
  var r=S[cur], dt=Number(r.d.slice(5,7))+'월 '+Number(r.d.slice(8,10))+'일';
  if(r.k){ $('kbig').innerHTML='<b>'+ksum(r)+'</b><small>개</small>'; $('kmeta').textContent=dt+r.k.map(function(v,j){ return v?' · '+KN[j]+' '+v:''; }).join(''); }
  else { $('kbig').innerHTML='<b>—</b>'; $('kmeta').textContent=dt+' · 입력 안 함'; } }
function list(){
  var S=sorted().reverse();
  if(!$('list')){ var nm={}; R.forEach(function(r){ nm[r.n]=1; }); $('fL').innerHTML=Object.keys(nm).map(function(k){ return '<option value="'+esc(k)+'">'; }).join(''); return; }
  $('lh').classList.toggle('mk-hide', !S.length); $('list').classList.toggle('mk-hide', !S.length);
  $('list').innerHTML=S.map(function(r){ return '<div class="mk-li" data-id="'+esc(r.id)+'"><span class="t"><b>'+esc(r.n)+'</b><small>'+r.d.replace(/-/g,'.')+' · A '+fmt(r.a)+' · B '+fmt(r.b)+(r.k?' · 오답 '+ksum(r):'')+'</small></span><span class="s">'+fmt(r.a+r.b)+'<small>/80</small></span>'
    +'<button class="mk-del" type="button" aria-label="이 기록 지우기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>'; }).join('');
  var names={}; R.forEach(function(r){ names[r.n]=1; });
  $('fL').innerHTML=Object.keys(names).map(function(k){ return '<option value="'+esc(k)+'">'; }).join('');
}
function today(){ var d=new Date(); d=new Date(d.getTime()-d.getTimezoneOffset()*60000); return d.toISOString().slice(0,10); }
function kv(i){ var v=String($('k'+i).value||'').trim(); if(!v) return ''; return /^\d{1,2}$/.test(v)?+v:null; }   
function kinds(){ var a=[1,2,3,4].map(kv); if(a.every(function(x){ return x===''; })) return null; return a.map(function(x){ return x===''?0:x; }); }   
function ok(){ return $('fN').value.trim() && /^\d{4}-\d{2}-\d{2}$/.test($('fD').value) && num($('fA').value,MXA)!=null && num($('fB').value,MXB)!=null && [1,2,3,4].every(function(i){ return kv(i)!==null; }); }

function lost(){ var a=num($('fA').value,MXA), b=num($('fB').value,MXB); return a==null||b==null?null:Math.ceil(MXA+MXB-a-b-1e-9); }
function ksumIn(){ return [1,2,3,4].reduce(function(t,i){ var v=kv(i); return t+(typeof v==='number'?v:0); },0); }
function kfit(){ var l=lost(); return l==null || ksumIn()<=l; }
function upd(){ var l=lost(), k=ksumIn(), h=$('kh');
  if(l==null) h.innerHTML='틀린 문항 · 안 넣어도 됨';
  else h.innerHTML='틀린 문항 · '+(k?'<b class="'+(k>l?'mk-over':'')+'">'+k+'</b> / '+l+'개':l+'개 안에서')+' · 안 넣어도 됨';
  $('add').disabled=!(ok() && kfit()); }
['fN','fD','fA','fB','k1','k2','k3','k4'].forEach(function(i){ $(i).addEventListener('input', upd); });
$('fD').value=today();
$('add').onclick=function(){ if(!ok()||!kfit()) return;
  R.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), n:$('fN').value.trim(), d:$('fD').value, a:num($('fA').value,MXA), b:num($('fB').value,MXB), k:kinds(), at:Date.now()});
  save(); sel=null; ['fA','fB','fN','k1','k2','k3','k4'].forEach(function(i){ $(i).value=''; }); upd(); list(); draw();
  if(window.goatcounter&&goatcounter.count) try{ goatcounter.count({path:'mock/add', event:true}); }catch(e){} };
$('del').addEventListener('click', function(){ var id=this.dataset.id; if(!id || !confirm('이 기록을 지웁니다.')) return; R=R.filter(function(r){ return r.id!==id; }); save(); sel=null; list(); draw(); });
if($('list')) $('list').addEventListener('click', function(ev){ var li=ev.target.closest('.mk-li'); if(!li) return;
  if(ev.target.closest('.mk-del')){ if(!confirm('이 기록을 지웁니다.')) return; R=R.filter(function(r){ return r.id!==li.dataset.id; }); save(); sel=null; list(); draw(); return; }
  var S=sorted(); for(var i=0;i<S.length;i++) if(S[i].id===li.dataset.id){ sel=(sel===i)?null:i; break; } draw(); });
$('rng').addEventListener('click', function(ev){ var b=ev.target.closest('button'); if(!b) return; rng=b.dataset.v; try{ localStorage.setItem('rn_mock_range', rng); }catch(e){} sel=null; draw(); });
$('seg').addEventListener('click', function(ev){ var b=ev.target.closest('button'); if(!b) return; mode=b.dataset.m; try{ localStorage.setItem(MKEY, mode); }catch(e){} draw(); });
function scrub(ev){ var svg=$('wrap').querySelector('svg'); if(!svg) return; var n=VIEW.length, rc=svg.getBoundingClientRect(), vx=(ev.clientX-rc.left)/rc.width*W;
  var i=n<2?0:Math.max(0,Math.min(n-1,Math.round((vx-L)/((W-L-RR)/(n-1))))); if(i!==sel){ sel=i===n-1?null:i; draw(); } }
$('wrap').addEventListener('pointerdown', scrub); $('wrap').addEventListener('pointermove', function(e){ if(e.pointerType==='mouse'||e.buttons) scrub(e); });
var lw=0; function fit(){ var w=$('wrap').clientWidth; if(w!==lw){ lw=w; draw(); } }
if(window.ResizeObserver) new ResizeObserver(fit).observe($('wrap')); else addEventListener('resize', fit);
list(); draw(); upd();
})();
</script>
