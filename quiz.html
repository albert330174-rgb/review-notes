  <a class="qz-main qsub qz-hide" id="bNote" style="margin-top:10px;text-align:center;line-height:50px;text-decoration:none">노트로 돌아가기</a>
  <div class="qz-wrong" id="rWrong"></div>
</div>

<div class="qz-sheet" id="pk" role="dialog" aria-label="범위 고르기"><div class="qz-pk">
  <div class="qz-pk-hd"><b>범위 고르기</b><input type="search" id="pkQ" placeholder="과목·주제 검색"></div>
  <div class="qz-pk-ls" id="pkLs"></div>
  <div class="qz-pk-ft"><button class="no" type="button" id="pkNo">취소</button><button class="ok" type="button" id="pkOk">확인</button></div>
</div></div>

<div class="qz-sheet" id="sh" role="dialog" aria-label="이 문제 이상해요"><div class="qz-odd">
  <div class="qh"><b>이 문제 이상해요</b><button class="qz-x" type="button" id="bShX" aria-label="닫기">✕</button></div>
  <textarea id="shT" placeholder="어디가 이상한지"></textarea>
  <button class="qz-main" type="button" id="bShGo">보내기</button>
  <p class="qz-mini qz-hide" id="shOk">보냈어요 · <a class="qz-link" href="status.html">처리 현황</a></p>
</div></div>
<script>
(function(){
var FORM='https://docs.google.com/forms/d/e/1FAIpQLSfz6jnwKa5X7m2UGdgl0CS1w878pH9G4IJCBow2QKHcaJN0Yg/formResponse', E_SUBJ='entry.1832714038', E_TEXT='entry.524873215', KEY='rn_quiz_v1';
var GO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>';
var CHK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
var TW='<svg class="tw" viewBox="0 0 10 10"><path d="M3 1.5 7 5l-4 3.5z" fill="currentColor"/></svg>';
var $=function(id){ return document.getElementById(id); };
var D=[], BY={}, rec={}, run=null, nPick=10, SUBJ=[], TOPS={}, sel={};
function load(){ try{ rec=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ rec={}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }
try{ var n0=+localStorage.getItem(KEY+'_n'); if(n0>=5&&n0%5===0) nPick=n0; }catch(e){}
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
function sname(s){ return s.split('.').slice(1).join('.')||s; }
function key(c){ return c.s+'|'+c.t+'|'+(c.m||''); }   // 고르기 단위 = 중주제(10-08 「대주제로만 빼니 뭉친다」 · 도형과 측정 163)
function keysOf(s, tt){ var o=[]; TOPS[s].forEach(function(x){ if(tt!=null&&x.t!==tt) return; x.ms.forEach(function(y){ o.push(s+'|'+x.t+'|'+y.m); }); }); return o; }
function stOf(ks, S){ var n=ks.filter(function(k){ return S[k]; }).length; return n===0?'':n===ks.length?'on':'mix'; }
function selN(){ return Object.keys(sel).length; }
function inSel(c){ return !selN() || sel[key(c)]; }
function pool(){ var w=$('sW').checked; return D.filter(function(c){ return inSel(c) && (!w||(rec[c.id]&&rec[c.id][3]===0)); }); }
function rangeText(){ if(!selN()) return '전체';
  var labs=[], subs=[];
  SUBJ.forEach(function(s){ var st=stOf(keysOf(s), sel); if(!st) return; subs.push(s);
    if(st==='on'){ labs.push(sname(s)+' 전체'); return; }
    TOPS[s].forEach(function(x){ var ks=keysOf(s,x.t), sx=stOf(ks, sel); if(!sx) return;
      if(sx==='on') labs.push(x.t); else { var on=x.ms.filter(function(y){ return sel[s+'|'+x.t+'|'+y.m]; }); labs.push(on.length===1&&on[0].m?on[0].m:x.t+' 일부'); } }); });
  if(subs.length>1) return subs.map(sname).join(' · ');
  var pre=labs[0]&&labs[0].indexOf(' 전체')>0?'':sname(subs[0])+' › ';
  return pre+labs[0]+(labs.length>1?' 외 '+(labs.length-1):''); }
function info(){ var p=pool(), all=D.filter(inSel), wn=all.filter(function(c){ return rec[c.id]&&rec[c.id][3]===0; }).length, seen=all.filter(function(c){ return rec[c.id]; }).length;
  $('sRange').textContent=rangeText();
  $('sW').disabled=!wn; if(!wn) $('sW').checked=false;
  $('sInfo').textContent=$('sW').checked ? '틀린 문제 '+p.length+'개' : '문제 '+all.length.toLocaleString()+'개 · 푼 것 '+seen+'개 · 안 푼 것부터 나와요';
  slSet(p.length);
  $('bGo').disabled=!p.length;
  var tot=Object.keys(rec).filter(function(k){ return BY[k]; }), ok=tot.filter(function(k){ return rec[k][3]===1; }).length;
  $('sRec').innerHTML = tot.length ? '이 기기 기록 · 푼 문제 '+tot.length+'개 · 마지막에 맞힌 것 '+ok+'개 · <button class="qz-link" type="button" id="bClr">기록 지우기</button>' : '기록은 이 기기에만 남아요';
  var c=$('bClr'); if(c) c.onclick=function(){ if(confirm('이 기기의 쪽지시험 기록을 지울까요?')){ rec={}; save(); info(); } }; }

var poolN=0;   // nPick = 고른 값(기억) · 화면 값 = 지금 범위에 맞춘 값(nCur) — 범위가 좁아져도 고른 값을 잃지 않는다
function stepVals(){ var v=[], top=Math.min(poolN,100); for(var i=5;i<top;i+=5) v.push(i); v.push(top); return v; }   // 한 번에 최대 100 · 범위가 100 이하면 끝 = 전부
function nCur(){ if(poolN<=0) return 0; var top=Math.min(poolN,100); if(nPick>=top) return top; var vs=stepVals().filter(function(x){ return x<=nPick; }); return vs.length?vs[vs.length-1]:stepVals()[0]; }
function slSet(n){ poolN=n; slShow(); }
function slShow(){ var vs=stepVals(), c=nCur(), i=vs.indexOf(c); $('sNv').textContent=poolN?(c>=poolN?'전부 ':'')+c+'문제':'—'; $('sNm').disabled=!poolN||i<=0; $('sNp').disabled=!poolN||i>=vs.length-1; }
function stepBy(d){ var vs=stepVals(), i=Math.max(0,Math.min(vs.length-1,vs.indexOf(nCur())+d)); nPick=(vs[i]>=poolN&&poolN<=100)?999:vs[i]; slShow(); if(nPick<999) try{ localStorage.setItem(KEY+'_n', nPick); }catch(x){} }
$('sNm').onclick=function(){ stepBy(-1); }; $('sNp').onclick=function(){ stepBy(1); };
$('sW').onchange=info;
var pkSel={}, pkOpen={};
var pkOpenT={};
function pkDraw(){ var q=$('pkQ').value.trim(), h=[], hit=function(x){ return !q||x.indexOf(q)>=0; };
  SUBJ.forEach(function(s){ var sn=sname(s), tops=TOPS[s], hitS=hit(sn);
    var vis=tops.map(function(x){ var hitT=hitS||hit(x.t), ms=x.ms.filter(function(y){ return hitT||hit(y.m); }); return {x:x, ms:ms, hitT:hitT}; }).filter(function(v){ return v.ms.length; });
    if(!vis.length) return;
    var open=pkOpen[s]||(q&&!hitS), tot=tops.reduce(function(a,x){ return a+x.n; },0);
    h.push('<div class="qz-pr'+(open?' qopen':'')+'"><button type="button" class="qz-ck '+stOf(keysOf(s),pkSel)+'" data-s="'+esc(s)+'" aria-label="'+esc(sn)+' 고르기">'+CHK+'</button><button type="button" class="qnm" data-o="'+esc(s)+'">'+TW+esc(sn)+'</button><span class="n">'+tot+'</span></div>');
    if(!open) return;
    vis.forEach(function(v){ var x=v.x, tk=s+'|'+x.t, multi=x.ms.length>1, topen=multi&&(pkOpenT[tk]||(q&&!v.hitT));
      h.push('<div class="qz-pr c'+(topen?' qopen':'')+'"><button type="button" class="qz-ck '+stOf(keysOf(s,x.t),pkSel)+'" data-t="'+esc(tk)+'" aria-label="'+esc(x.t)+' 고르기">'+CHK+'</button><button type="button" class="qnm" '+(multi?'data-ot="'+esc(tk)+'"':'data-t="'+esc(tk)+'"')+'>'+(multi?TW:'<span class="tw0"></span>')+esc(x.t)+'</button><span class="n">'+x.n+'</span></div>');
      if(topen) v.ms.forEach(function(y){ var k=tk+'|'+y.m; h.push('<div class="qz-pr c2"><button type="button" class="qz-ck'+(pkSel[k]?' on':'')+'" data-k="'+esc(k)+'" aria-label="'+esc(y.m||x.t)+' 고르기">'+CHK+'</button><button type="button" class="qnm" data-k="'+esc(k)+'">'+esc(y.m||'(그 밖)')+'</button><span class="n">'+y.n+'</span></div>'); }); }); });
  $('pkLs').innerHTML=h.join('')||'<p class="qz-cap">찾는 과목·주제가 없어요</p>'; }
function pkFlip(ks){ var on=stOf(ks,pkSel)!=='on'; ks.forEach(function(k){ if(on) pkSel[k]=1; else delete pkSel[k]; }); }
$('pkLs').onclick=function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.s) pkFlip(keysOf(b.dataset.s));
  else if(b.dataset.o) pkOpen[b.dataset.o]=!pkOpen[b.dataset.o];
  else if(b.dataset.ot) pkOpenT[b.dataset.ot]=!pkOpenT[b.dataset.ot];
  else if(b.dataset.t){ var p=b.dataset.t.split('|'); pkFlip(keysOf(p[0], p.slice(1).join('|'))); }
  else if(b.dataset.k){ var k=b.dataset.k; if(pkSel[k]) delete pkSel[k]; else pkSel[k]=1; }
  pkDraw(); };
$('pkQ').oninput=pkDraw;
$('bRange').onclick=function(){ pkSel=Object.assign({},sel); pkOpen={}; pkOpenT={}; SUBJ.forEach(function(s){ if(stOf(keysOf(s),sel)) pkOpen[s]=1; TOPS[s].forEach(function(x){ if(stOf(keysOf(s,x.t),sel)==='mix') pkOpenT[s+'|'+x.t]=1; }); }); $('pkQ').value=''; pkDraw(); $('pk').classList.add('on'); };
$('pkNo').onclick=function(){ $('pk').classList.remove('on'); };
$('pkOk').onclick=function(){ sel=pkSel; $('pk').classList.remove('on'); info(); };
$('pk').onclick=function(e){ if(e.target===$('pk')) $('pk').classList.remove('on'); };
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(p){ var lim=nCur()||undefined; if($('sW').checked) return shuffle(p.slice()).slice(0,lim);
  var fresh=shuffle(p.filter(function(c){ return !rec[c.id]; })), old=p.filter(function(c){ return rec[c.id]; })
    .sort(function(a,b){ return (rec[a.id][3]-rec[b.id][3]) || (rec[a.id][2]-rec[b.id][2]); });
  return fresh.concat(old).slice(0,lim); }
function show(v){ ['vSet','vQ','vR'].forEach(function(x){ $(x).classList.toggle('qz-hide', x!==v); }); scrollTo(0,0); }
function start(list){ run={list:list, i:0, res:[]}; $('qName').textContent=selN()?rangeText():'쪽지시험'; show('vQ'); paint(); }
$('bGo').onclick=function(){ start(pick(pool())); };
function img(box, c, on){ box.innerHTML=''; (c.img||[]).forEach(function(m){ if(m.on!==on) return; var i=document.createElement('img'); i.className='qz-img'; i.src=m.p; i.alt='문제 그림'; i.loading='lazy'; box.appendChild(i); }); }
var revealed=false;
function paint(){ var c=run.list[run.i], n=run.list.length; revealed=false;
  $('qN').textContent=(run.i+1)+'/'+n; $('qBar').style.width=(run.i/n*100)+'%';
  $('qWhere').innerHTML=esc(c.sn)+' <i>› '+esc(c.t)+(c.m&&innerWidth>500?' › '+esc(c.m):'')+'</i>';
  var r=rec[c.id]; $('qWhy').textContent=!r?'처음 보는 문제':r[3]?'지난번에 맞힘':'지난번에 틀림';
  $('qQ').textContent=c.q; $('qQ').classList.toggle('long', c.q.length>200);
  $('qA').textContent=c.a; $('qA').className='qz-a'+(c.a.length>30?' body':c.a.length>12?' qmid':'');
  var ol=$('qItems'); ol.innerHTML=''; ol.classList.toggle('qz-hide', !(c.it&&c.it.length>1));
  (c.it||[]).forEach(function(x){ var li=document.createElement('li'); li.textContent=x; ol.appendChild(li); });
  img($('qImgF'), c, 'f'); img($('qImgB'), c, 'b');
  var a=$('qNote'); if(c.h){ a.href=c.h; a.classList.remove('qz-hide'); } else a.classList.add('qz-hide');
  $('qAns').style.visibility='hidden'; $('qCover').classList.remove('qz-hide');
  $('aShow').classList.remove('qz-hide'); $('aRate').classList.add('qz-hide'); }
function reveal(){ if(!run||$('vQ').classList.contains('qz-hide')||revealed) return; revealed=true;
  $('qAns').style.visibility=''; $('qCover').classList.add('qz-hide'); $('aShow').classList.add('qz-hide'); $('aRate').classList.remove('qz-hide'); }
function rate(ok){ if(!run||!revealed) return; var c=run.list[run.i], r=rec[c.id]||[0,0,0,0];
  r[0]++; if(ok) r[1]++; r[2]=Date.now(); r[3]=ok?1:0; rec[c.id]=r; save(); run.res.push(ok);
  run.i++; if(run.i<run.list.length) paint(); else result(); }
$('bShow').onclick=reveal; $('qCard').onclick=function(e){ if(e.target.closest('a,button')) return; reveal(); };
$('bOk').onclick=function(){ rate(true); }; $('bNo').onclick=function(){ rate(false); };
$('bQuit').onclick=function(){ if(run&&run.res.length) result(); else { run=null; show('vSet'); info(); } };
function result(){ var done=run.res.length, ok=run.res.filter(Boolean).length, wr=run.list.slice(0,done).filter(function(c,i){ return !run.res[i]; });
  $('rScore').textContent=done+'문제 중 '+ok+'개 맞음'; $('rSub').textContent=wr.length?'틀린 문제는 노트에서 확인해 보세요':'다 맞았어요';
  $('bAgain').classList.toggle('qz-hide', !wr.length); run.wrong=wr;
  $('rWrong').innerHTML = wr.length ? '<h2>틀린 문제</h2><div class="qz-grp">'+wr.map(function(c){ return '<div class="qz-w"><div><p>'+esc(c.q)+'</p><p class="wa">'+esc(c.a)+'</p></div>'+(c.h?'<a class="qz-go" href="'+esc(c.h)+'" target="_blank" rel="noopener" aria-label="노트에서 보기" title="노트에서 보기">'+GO+'</a>':'')+'</div>'; }).join('')+'</div>' : '';
  show('vR'); }
$('bAgain').onclick=function(){ start(shuffle(run.wrong.slice())); };
$('bNew').onclick=function(){ run=null; show('vSet'); info(); };
var odd=null;
$('bOdd').onclick=function(e){ e.stopPropagation(); odd=run.list[run.i]; $('shT').value=''; $('bShGo').disabled=false; $('bShGo').textContent='보내기'; $('shOk').classList.add('qz-hide'); $('sh').classList.add('on'); setTimeout(function(){ $('shT').focus(); },50); };
function shut(){ $('sh').classList.remove('on'); }
$('bShX').onclick=shut; $('sh').onclick=function(e){ if(e.target===$('sh')) shut(); };

var tip=function(btn,msg){ var t=document.querySelector('.rn-tip'); if(!t){ t=document.createElement('div'); t.className='rn-tip'; document.body.appendChild(t); } var r=btn.getBoundingClientRect(); t.textContent=msg; t.style.left=(r.left+r.width/2)+'px'; t.style.top=(r.top-10)+'px'; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },1800); };
$('bShGo').onclick=function(){ if(!odd||$('bShGo').disabled) return; var b=$('bShGo'); if(!$('shT').value.trim()){ tip(b,'어디가 이상한지 적어 주세요'); $('shT').focus(); return; } b.disabled=true; b.textContent='보내는 중…';
  var body=new URLSearchParams(); body.append(E_SUBJ, odd.sn);
  body.append(E_TEXT, '[카드] '+odd.id+'\n[위치] 쪽지시험 > '+odd.t+(odd.m?' > '+odd.m:'')+'\n[내용] '+$('shT').value.trim());
  fetch(FORM,{method:'POST',mode:'no-cors',body:body}).then(function(){ b.disabled=false; b.textContent='보내기'; $('shT').value=''; $('shOk').classList.remove('qz-hide'); })
    .catch(function(){ b.disabled=false; b.textContent='다시 보내기'; alert('보내지 못했어요'); }); };
document.addEventListener('keydown', function(e){ if($('sh').classList.contains('on')||$('pk').classList.contains('on')){ if(e.key==='Escape'){ shut(); $('pk').classList.remove('on'); } return; }
  if($('vQ').classList.contains('qz-hide')||e.metaKey||e.ctrlKey||e.altKey) return;
  var k=e.key.toLowerCase();
  if(k===' '||k==='enter'){ e.preventDefault(); reveal(); } else if(k==='z'||k==='1') rate(false); else if(k==='c'||k==='2') rate(true); });
var QS=new URLSearchParams(location.search), FROM=QS.get('from'), NOTE=(QS.get('s')&&FROM)?encodeURIComponent(QS.get('s'))+'.html#rn-qz-'+encodeURIComponent(FROM):null;
function backTo(a){ if(!NOTE) return; a.href=NOTE; a.lastChild.textContent='노트'; }
if(NOTE){ backTo($('bBack1')); backTo($('bBack2')); $('bNote').href=NOTE; $('bNote').classList.remove('qz-hide'); }
load();
fetch('quiz-data.json?v=988af408').then(function(r){ return r.json(); }).then(function(j){ D=j.cards||[];
  D.forEach(function(c){ BY[c.id]=c; if(!TOPS[c.s]){ TOPS[c.s]=[]; SUBJ.push(c.s); }
    var x=TOPS[c.s].filter(function(z){ return z.t===c.t; })[0]; if(!x){ x={t:c.t, n:0, ms:[]}; TOPS[c.s].push(x); } x.n++;
    var y=x.ms.filter(function(z){ return z.m===(c.m||''); })[0]; if(!y){ y={m:c.m||'', n:0}; x.ms.push(y); } y.n++; });
  var s0=QS.get('s'), t0=QS.get('t'); if(s0&&t0&&TOPS[s0]&&TOPS[s0].some(function(x){ return x.t===t0; })) keysOf(s0,t0).forEach(function(k){ sel[k]=1; });
  info(); }).catch(function(){ $('sInfo').textContent='문제를 불러오지 못했어요 — 새로고침해 주세요'; $('bGo').disabled=true; });
})();
</script>
