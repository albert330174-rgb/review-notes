<style>

body{margin:0;background:var(--bg);color:var(--label);}
.in{max-width:640px;margin:0 auto;padding:56px 20px 72px;font-size:17px;line-height:1.55;word-break:keep-all;}
.in h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em;margin:0 0 24px;}
.grp{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
.grp .srow{position:relative;}
.grp .srow+.srow::before{content:'';position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep);z-index:1;}
.grp a.go{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px 0 20px;color:var(--label);text-decoration:none;}
.grp a.go:active,.grp a.dl:active{background:var(--fill);}

.grp a.dl{position:absolute;top:50%;right:36px;transform:translateY(-50%);width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--acc);}
.grp a.dl svg{width:20px;height:20px;}
@media (hover:hover){.grp a.dl:hover{background:var(--fill);}}
.in-foot{margin:16px 20px 0;font-size:13px;line-height:18px;color:var(--ter);}
.in-foot a{color:var(--acc);text-decoration:none;}
@media print{.in-foot{display:none;}}
.grp a.go svg{width:8px;height:14px;color:var(--ter);flex:0 0 auto;}
@media (max-width:430px){ .in{padding:40px 16px 56px;} .in h1{font-size:28px;line-height:34px;} }
