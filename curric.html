  var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  [].forEach.call(document.querySelectorAll('.c'), function(c){ var s=document.createElement('span'); s.className='rn-in'; while(c.firstChild) s.appendChild(c.firstChild); c.appendChild(s); });
  
  var on=false, gr='all', ca='all'; try{ on=localStorage.getItem(OKEY)==='1'; gr=localStorage.getItem(GKEY)||'all'; ca=localStorage.getItem(CKEY)||'all'; }catch(e){}
  if(['all','34','56'].indexOf(gr)<0) gr='all';
  function cats(){ var o=[]; [].forEach.call(document.querySelectorAll('#book'+sub+' .c'), function(e){ if(o.indexOf(e.dataset.cat)<0) o.push(e.dataset.cat); }); return o; }
  function hides(el){ return on && (gr==='all' || el.dataset.g===gr) && (ca==='all' || el.dataset.cat===ca); }
  function apply(){ [].forEach.call(document.querySelectorAll('.c'), function(el){ el.classList.toggle('cm-h', hides(el)); el.classList.remove('rn-show','rn-tyok','rn-tyno'); }); tyClose(); }
  function typing(){ var v='0'; try{ v=localStorage.getItem(TKEY)||'0'; }catch(e){} return v==='1'; }
  var ty=null, norm=function(x){ return (x||'').toLowerCase().replace(/[\s·ㆍ・,.:;!?'"“”‘’「」『』()（）\[\]{}<>〈〉《》\-–—~/]/g,''); };
  function tyClose(){ if(ty){ ty.box.remove(); ty=null; } }
  function vis(e){ return e.getClientRects().length>0; }
  function nextHidden(t){ var all=[].slice.call(document.querySelectorAll('.c.cm-h:not(.rn-show)')).filter(function(e){ return vis(e) && e.dataset.g!=='tl'; });
    for(var i=0;i<all.length;i++) if(t.compareDocumentPosition(all[i])&4) return all[i]; return null; }
  function reveal(t, cls){ t.classList.add('rn-show'); if(cls) t.classList.add(cls); }
  function go(t){ tyClose(); var n=t&&nextHidden(t); if(!n) return; var r=n.getBoundingClientRect(); if(r.top<110||r.bottom>innerHeight-80) n.scrollIntoView({block:'center'}); tyOpen(n); }
  function tyOpen(t){ tyClose(); var inn=t.querySelector('.rn-in')||t, r=inn.getClientRects()[0]||t.getBoundingClientRect();
    var box=document.createElement('div'); box.className='rn-ty'; box.innerHTML='<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="가린 말 쓰기"><button type="button">보기</button>';
    box.style.font=getComputedStyle(inn).font; box.style.left=Math.max(4, r.left+scrollX-4)+'px'; box.style.top=(r.top+scrollY-4)+'px';
    var inp=box.firstChild; inp.style.width=Math.max(72, Math.min(innerWidth-90, Math.round(r.width)+8))+'px'; document.body.appendChild(box);
    var miss=0, want=norm(inn.textContent); ty={box:box, t:t};
    box.lastChild.onclick=function(ev){ ev.stopPropagation(); reveal(t); go(t); };
    box.addEventListener('click', function(ev){ ev.stopPropagation(); });
    inp.addEventListener('keydown', function(ev){
      if(ev.isComposing||ev.keyCode===229) return;
      if(ev.key==='Escape'){ ev.preventDefault(); reveal(t); tyClose(); }
      else if(ev.key==='Tab'){ ev.preventDefault(); go(t); }
      else if(ev.key==='Enter'){ ev.preventDefault(); var v=norm(inp.value); if(!v){ reveal(t); go(t); return; }
        if(v===want){ reveal(t,'rn-tyok'); go(t); }
        else if(++miss>=2){ reveal(t,'rn-tyno'); tyClose(); }
        else { box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); inp.select(); } } });
    setTimeout(function(){ inp.focus(); }, 0); }
  document.addEventListener('click', function(ev){ if(ty && !ty.box.contains(ev.target)) tyClose(); }, true);
  document.addEventListener('click', function(ev){ var t=ev.target.closest('.c.cm-h'); if(!t) return;
    if(!t.classList.contains('rn-show') && typing() && t.dataset.g!=='tl'){ tyOpen(t); return; }
    t.classList.toggle('rn-show'); });
  var mm=document.createElement('div'); mm.className='rn-mm'; mm.setAttribute('role','menu');
  mm.innerHTML=[['0','끄기'],['1','마스킹']].map(function(x){ return '<button type="button" role="menuitemradio" data-o="'+x[0]+'"><span class="ck">'+CHECK+'</span><span class="t"><b>'+x[1]+'</b></span></button>'; }).join('')+
    '<button type="button" class="tg" role="menuitemcheckbox" data-t="1"><span class="ck">'+CHECK+'</span><span class="t"><b>타이핑으로 열기</b></span></button>';
  document.body.appendChild(mm);
  var b=document.createElement('button'); b.type='button'; b.className='rn-mk'; b.setAttribute('aria-haspopup','menu'); b.setAttribute('aria-expanded','false'); document.getElementById('ctMk').appendChild(b);
  var cg=document.getElementById('ctG'), cc=document.getElementById('ctC');
  function chips(){ var gs=[['all','전체'],['34','3~4'],['56','5~6']].filter(function(x){ return x[0]==='all' || document.querySelector('#book'+sub+' .c[data-g="'+x[0]+'"]'); });   
    if(!gs.some(function(x){ return x[0]===gr; })){ gr='all'; save(); }
    cg.innerHTML=gs.map(function(x){ return '<button type="button" data-gr="'+x[0]+'">'+x[1]+'</button>'; }).join('');
    cc.innerHTML=[['all','전체']].concat(cats().map(function(k){ return [k, CAT_LABEL[k]||k]; })).map(function(x){ return '<button type="button" data-ca="'+x[0]+'">'+x[1]+'</button>'; }).join(''); }
  function paint(){ b.innerHTML=(on?BOXF:BOX)+'<span>마스킹</span>'; b.classList.toggle('on', on); cc.hidden=!on; cg.hidden=!on||cg.children.length<2;   
    [].forEach.call(mm.querySelectorAll('button[data-o]'), function(x){ var sel=(x.dataset.o==='1')===on; x.classList.toggle('sel', sel); x.setAttribute('aria-checked', sel); });
    var tb=mm.querySelector('button[data-t]'); tb.classList.toggle('sel', typing()); tb.setAttribute('aria-checked', typing());
    [].forEach.call(cg.querySelectorAll('button'), function(x){ x.classList.toggle('on', x.dataset.gr===gr); x.setAttribute('aria-pressed', x.dataset.gr===gr); });
    [].forEach.call(cc.querySelectorAll('button'), function(x){ x.classList.toggle('on', x.dataset.ca===ca); x.setAttribute('aria-pressed', x.dataset.ca===ca); }); }
  function save(){ try{ localStorage.setItem(OKEY, on?'1':'0'); localStorage.setItem(GKEY, gr); localStorage.setItem(CKEY, ca); }catch(e){} }
  var opened=false;
  function close(){ mm.classList.remove('on'); b.setAttribute('aria-expanded','false'); opened=false; }
  function open(){ var r=b.getBoundingClientRect(); mm.classList.add('on'); mm.style.top=(r.bottom+6)+'px'; mm.style.left=Math.max(8, Math.min(innerWidth-mm.offsetWidth-8, r.right-mm.offsetWidth))+'px'; b.setAttribute('aria-expanded','true'); opened=true; }
  b.onclick=function(ev){ ev.stopPropagation(); if(opened) close(); else open(); };
  mm.addEventListener('click', function(ev){ var tb=ev.target.closest('button[data-t]');
    if(tb){ try{ localStorage.setItem(TKEY, typing()?'0':'1'); }catch(e){} tyClose(); paint(); return; }
    var x=ev.target.closest('button[data-o]'); if(!x) return;
    var to=x.dataset.o==='1'&&!on;   
    if(to!==on){ on=to; save(); apply(); paint(); }
    close(); });
  cg.addEventListener('click', function(ev){ var x=ev.target.closest('button[data-gr]'); if(!x) return; gr=x.dataset.gr; save(); apply(); paint(); });
  cc.addEventListener('click', function(ev){ var x=ev.target.closest('button[data-ca]'); if(!x) return; ca=x.dataset.ca; save(); apply(); paint(); });
  document.addEventListener('click', function(ev){ if(opened && !mm.contains(ev.target) && !b.contains(ev.target)) close(); }, true);
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && opened) close(); });
  addEventListener('scroll', function(){ if(opened) close(); }, {passive:true}); addEventListener('resize', close);
  function show(s){ sub=s; CT_SUBS.forEach(function(k){ document.getElementById('book'+k).hidden=(k!==s); });
    [].forEach.call(document.querySelectorAll('[data-sub]'), function(x){ x.classList.toggle('on', x.dataset.sub===s); });
    chips(); if(ca!=='all' && cats().indexOf(ca)<0){ ca='all'; save(); } apply(); paint();
    try{ history.replaceState(null,'','#'+s); }catch(e){} }
  [].forEach.call(document.querySelectorAll('[data-sub]'), function(x){ x.onclick=function(){ show(x.dataset.sub); }; });
  function fromHash(){ var h=location.hash.slice(1); show(CT_SUBS.indexOf(h)>=0?h:CT_SUBS[0]); }
  addEventListener('hashchange', fromHash); fromHash();
})();
</script>
