<style>

body{margin:0;background:var(--bg);color:var(--label);}
.in{max-width:640px;margin:0 auto;padding:40px 20px 72px;font-size:17px;line-height:1.55;word-break:keep-all;}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc);text-decoration:none;font-size:17px;margin:0 0 8px -4px;}
.back svg{width:10px;height:17px;}
.in h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em;margin:0 0 20px;}
.grp{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px 0 20px;position:relative;}
.row+.row::before{content:'';position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep);}
.row label{flex:0 0 64px;color:var(--label);}
.row select{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--label);background:transparent;border:0;padding:12px 0;text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none;}
.row select:disabled{color:var(--ter);}
.row .cv{width:8px;height:14px;color:var(--ter);flex:0 0 auto;}

.row select{display:none;}
.row .pv{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:12px;border:0;background:none;padding:14px 0;font:inherit;font-size:17px;color:var(--sec);cursor:pointer;text-align:right;}
.row .pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .pv.set{color:var(--label);} .row .pv:disabled{color:var(--ter);cursor:default;}
.row:has(.pv:not(:disabled)):active{background:var(--fill);}
.rp{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
.rp.on{display:flex;}
.rp-in{width:100%;max-width:480px;max-height:calc(100dvh - 32px);background:var(--bg);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.rp-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px 22px;}
.rp-hd b{font-size:20px;font-weight:700;}
.rp-x{width:32px;height:32px;border:0;border-radius:16px;background:var(--fill);color:var(--sec);font-size:17px;cursor:pointer;}
.rp-q{margin:0 18px 10px;height:40px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;font:inherit;font-size:16px;color:var(--label);}
.rp-q:focus{outline:none;box-shadow:0 0 0 2px var(--acc);}
.rp-ls{overflow:auto;margin:0 16px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);}
.rp-ls button{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 16px;border:0;background:none;font:inherit;font-size:16px;line-height:1.4;color:var(--label);text-align:left;cursor:pointer;position:relative;}
.rp-ls button+button::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep);}
.rp-ls button:active{background:var(--fill);}
.rp-ls button.dim{color:var(--sec);}
.rp-ls svg{width:16px;height:16px;flex:0 0 auto;color:var(--acc);margin-left:auto;visibility:hidden;}
.rp-ls button.on svg{visibility:visible;} .rp-ls button.on{font-weight:600;}
textarea{display:block;width:100%;box-sizing:border-box;min-height:160px;margin:0;padding:14px 20px;border:0;background:transparent;font:inherit;font-size:17px;line-height:1.5;color:var(--label);resize:vertical;}
textarea::placeholder{color:var(--ter);}

textarea:focus,.row select:focus{outline:none;}
.grp.ta:focus-within{box-shadow:0 0 0 2px var(--acc);}
.row:has(select:focus-visible){background:var(--fill);}
.cap{font-size:13px;line-height:18px;color:var(--sec);margin:8px 20px 20px;}
.send{display:block;width:100%;min-height:50px;margin-top:24px;border:0;border-radius:25px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:600;}
.send:disabled{opacity:.45;}

.rn-tip{position:fixed;z-index:200;transform:translate(-50%,-100%);padding:8px 14px;border-radius:18px;background:var(--label);color:var(--bg);font-size:14px;line-height:1.4;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.rn-tip.on{opacity:.92}
.done{display:none;text-align:center;padding:48px 20px;}
.done b{display:block;font-size:22px;margin-bottom:8px;}
.done p{color:var(--sec);margin:0 0 20px;}
.done a{color:var(--acc);text-decoration:none;}
.more{display:block;margin-top:16px;text-align:center;color:var(--acc);text-decoration:none;font-size:15px;}
@media (max-width:430px){ .in{padding:28px 16px 56px;} .in h1{font-size:28px;line-height:34px;} }
</style>

<script>

const TOC=(function(){ var R=window.RN_TOC||{}, o={}; for(var s in R) o[s]=R[s].map(function(g){ return [g[0], g[2].map(function(k){ return k[0]; })]; }); return o; })();
function rnFbId(){ try{ var v=localStorage.getItem('rn-fb-id'); if(!v){ var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a=new Uint32Array(4); crypto.getRandomValues(a); v=''; for(var i=0;i<4;i++) v+=c[a[i]%c.length]; localStorage.setItem('rn-fb-id',v); } return v; }catch(e){ return ''; } }
const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfz6jnwKa5X7m2UGdgl0CS1w878pH9G4IJCBow2QKHcaJN0Yg/formResponse', E_SUBJ='entry.1832714038', E_TEXT='entry.524873215';
const $=id=>document.getElementById(id);
const opt=(v,l)=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; return o; };
$('s').appendChild(opt('일반','일반'));   // 일반 피드백(10-08) — 폼 「과목」 선택지에 「일반」 추가함 · 단원·절 없음
Object.keys(TOC).forEach(s=>$('s').appendChild(opt(s,s)));
function fillG(){ const g=$('g'), p=$('p'); g.length=1; p.length=1; p.disabled=true; const s=TOC[$('s').value];
  g.disabled=!s; if(s) s.forEach((x,i)=>g.appendChild(opt(i,x[0]))); check(); }
function fillP(){ const p=$('p'); p.length=1; const s=TOC[$('s').value], x=s&&s[$('g').value];
  p.disabled=!(x&&x[1].length); if(x) x[1].forEach(n=>p.appendChild(opt(n,n))); }
const tip=function(btn,msg){ var t=document.querySelector('.rn-tip'); if(!t){ t=document.createElement('div'); t.className='rn-tip'; document.body.appendChild(t); } var r=btn.getBoundingClientRect(); t.textContent=msg; t.style.left=(r.left+r.width/2)+'px'; t.style.top=(r.top-10)+'px'; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },1800); }
function check(){}
$('s').onchange=fillG; $('g').onchange=fillP; $('t').oninput=check;

(()=>{ const q=new URLSearchParams(location.search), s=q.get('s'); if(!s||!TOC[s]){ $('s').value='일반'; fillG(); return; }   // 첫 화면에서 오면 대개 일반 피드백(10-09) — 「일반」을 미리 골라 둔다 · 과목 페이지에서 오면 그 과목
  $('s').value=s; fillG();
  const gi=TOC[s].findIndex(x=>x[0]===q.get('g')); if(gi<0) return; $('g').value=gi; fillP(); if(q.get('p')) $('p').value=q.get('p'); })();

const CK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function sync(){ document.querySelectorAll('.pv').forEach(b=>{ const s=$(b.dataset.for); b.disabled=s.disabled; b.classList.toggle('set', !!s.value); b.firstChild.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].textContent:''; }); }
let rpFor=null;
function rpDraw(){ const s=$(rpFor), q=$('rpQ').value.trim(); const esc=v=>String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  $('rpL').innerHTML=[...s.options].filter(o=>!q||!o.value||o.textContent.indexOf(q)>=0).map(o=>'<button type="button" data-v="'+esc(o.value)+'" class="'+(o.value===s.value?'on':'')+(o.value?'':' dim')+'"><span>'+esc(o.textContent)+'</span>'+CK+'</button>').join(''); }
document.querySelectorAll('.pv').forEach(b=>b.onclick=()=>{ rpFor=b.dataset.for; const s=$(rpFor); $('rpT').textContent=b.parentElement.querySelector('label').textContent; $('rpQ').value=''; $('rpQ').style.display=s.options.length>12?'':'none'; rpDraw(); $('rp').classList.add('on'); const on=$('rpL').querySelector('.on'); if(on) on.scrollIntoView({block:'center'}); });
$('rpQ').oninput=rpDraw;
$('rpL').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const s=$(rpFor); s.value=b.dataset.v; if(s.onchange) s.onchange(); $('rp').classList.remove('on'); sync(); };
$('rpX').onclick=()=>$('rp').classList.remove('on'); $('rp').onclick=e=>{ if(e.target===$('rp')) $('rp').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('rp').classList.remove('on'); });
sync();
$('f').onsubmit=async ev=>{ ev.preventDefault(); if($('b').disabled) return;
  if(!$('s').value){ tip($('b'),'과목 고르기'); return; }
  if(!$('t').value.trim()){ tip($('b'),'고칠 내용 적기'); $('t').focus(); return; }
  $('b').disabled=true; $('b').textContent='보내는 중…';
  const s=$('s').value, x=TOC[s]&&TOC[s][$('g').value], where=[x&&x[0], $('p').value].filter(Boolean).join(' > ');
  const body=new URLSearchParams(); body.append(E_SUBJ, s); body.append(E_TEXT, (where?'[위치] '+where+'\n':'')+'[내용] '+$('t').value.trim()+(rnFbId()?'\n[보낸 이] #'+rnFbId():''));
  try{ await fetch(FORM, {method:'POST', mode:'no-cors', body}); try{var a=JSON.parse(localStorage.getItem('rn-fb-sent')||'[]');a.push({t:Date.now(),s:s});localStorage.setItem('rn-fb-sent',JSON.stringify(a.slice(-20)));}catch(e){} $('f').style.display='none'; var id=rnFbId(); $('ok').querySelector('p').textContent=id?'제보 번호 #'+id:''; $('ok').style.display='block'; }
  catch(e){ $('b').disabled=false; $('b').textContent='다시 보내기'; alert('보내지 못함'); } };
</script>
